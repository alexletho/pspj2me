name: Feature request
description: Suggest an improvement for PSPJ2ME
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the feature and which games or situations it would help.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
